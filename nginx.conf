server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Angular routes are client-side, so any path that is not a real file has to return index.html
    # or a refresh on a deep link would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames can be cached forever; the two files without a hash must never be, or a
    # redeploy would leave browsers on the old bundle and the old API URL.
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /env.js {
        add_header Cache-Control "no-store";
    }
}
