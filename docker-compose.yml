# The dashboard on its own: the production bundle behind nginx.
#
#   docker compose up --build      then open http://localhost:8081
#
# The API is not started here -- it lives in the inventory-app repository. Bring that up first, and
# make sure it allows this origin (CORS_ALLOWED_ORIGINS must list http://localhost:8081).

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: inventory-dashboard:latest
    container_name: inventory-dashboard
    ports:
      - "${FRONTEND_PUBLISHED_PORT:-8081}:80"
    restart: on-failure
